<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talks — C. Murad Özsert</title>
  <meta name="description" content="">
  <link rel="canonical" href="https://ozsert.com/talks/">
  <link rel="icon" href="/favicon.ico">
  <script src="/shared/core.js"></script>
  <script src="/shared/topbar.js" defer></script>
  <link rel="stylesheet" href="/shared/house.css">
  <style>
    .t-toc { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 28px 0 0; padding: 0; list-style: none; font: 12px var(--mono); }
    .t-toc a { text-decoration: none; color: var(--muted); }
    .t-toc a:hover { color: var(--ink); }
    .t-vol { margin-top: 88px; scroll-margin-top: 64px; }
    .t-vol > header { display: grid; grid-template-columns: 64px 1fr; gap: 0 16px; align-items: baseline; }
    .t-vol h2 { font-size: clamp(24px, 3.4vw, 36px); line-height: 1.15; letter-spacing: -.025em; font-weight: 600; margin: 6px 0 0; grid-column: 2; }
    .t-vol .h-kicker { grid-column: 2; }
    .t-vol .num { grid-row: 1 / span 2; font: 500 12px var(--mono); color: var(--muted); padding-top: 4px; }
    .t-talk { display: grid; grid-template-columns: 64px minmax(0, 1fr) 240px; gap: 0 16px; padding: 40px 0; scroll-margin-top: 56px; position: relative; }
    .t-talk + .t-talk { border-top: 1px dashed var(--rule); }
    .t-talk .n { font: 500 12px var(--mono); color: var(--muted); padding-top: 8px; }
    .t-talk h3 { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2; letter-spacing: -.02em; font-weight: 600; margin: 0 0 4px; }
    .t-talk .sub { font-size: 18px; color: var(--muted); margin: 0 0 18px; }
    .t-talk .meta { display: flex; gap: 10px; align-items: center; margin: 0 0 16px; }
    .t-talk .sum { margin: 0 0 14px; max-width: 60ch; font-size: 18px; line-height: 1.5; }
    .t-talk .pts { list-style: none; margin: 0; padding: 0; max-width: 62ch; }
    .t-talk .pts li { position: relative; padding: 7px 0 7px 22px; border-top: 1px dashed var(--rule); font-size: 16px; line-height: 1.5; }
    .t-talk .pts li::before { content: "→"; position: absolute; left: 0; color: var(--ink); font-family: var(--mono); font-size: 13px; top: 9px; }
    .t-talk .pts b { font-weight: 600; }
    .t-talk figure { margin: 6px 0 0; transform: rotate(1.2deg); background: var(--card); padding: 8px 8px 26px; box-shadow: 0 1px 0 var(--rule), 0 10px 24px rgba(0,0,0,.08); position: relative; align-self: start; }
    .t-talk:nth-child(even) figure { transform: rotate(-1.4deg); }
    .t-talk figure::before { content: ""; position: absolute; top: -10px; left: 50%; width: 72px; height: 20px; margin-left: -36px; background: color-mix(in srgb, var(--ink) 22%, transparent); transform: rotate(-3deg); }
    .t-talk img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; filter: saturate(.85); }
    .t-talk .invite { display: inline-block; margin-top: 10px; font: 12px var(--mono); }
    .t-talk:target h3 { color: var(--ink); }
    @media (max-width: 860px) {
      .t-talk { grid-template-columns: 40px minmax(0, 1fr); }
      .t-talk figure { grid-column: 2; grid-row: 1; max-width: 340px; margin-bottom: 20px; }
      .t-vol > header { grid-template-columns: 40px 1fr; }
    }
    @media (max-width: 639px) { body { padding-bottom: 64px; } }
  </style>
</head>
<body>
  <oz-topbar></oz-topbar>
  <main class="h-wrap" id="top">
    <a class="h-back" href="/#talks" data-i18n="talks.back_home"></a>
    <div class="h-kicker">§ <span data-i18n="talks.section_no"></span> — <span data-i18n="hero.cta_talks"></span></div>
    <h1 class="h-title" data-i18n="talks.title"></h1>
    <p class="h-lead" data-i18n="talks.page_intro"></p>
    <p class="h-muted" data-i18n="talks.intro"></p>
    <ul class="t-toc" id="toc"></ul>
    <div id="vols"></div>
    <hr class="h-rule">
    <p><a class="h-btn" data-oz-email data-i18n="talks.cta" href="#"></a></p>
    <p class="h-foot">ozsert.com · <a href="/">←</a></p>
  </main>
  <script>
  (function () {
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function render() {
      return fetch("/content/" + OZ.lang + ".json").then(function (r) { return r.json(); }).then(function (d) {
        document.title = d["talks.page_title"];
        var featured = (d["talks.featured"] || "").split(",").map(function (s) { return s.trim(); });
        var slugs = Object.keys(d).filter(function (k) { return /^talk\.[a-z0-9-]+\.title$/.test(k); })
          .map(function (k) { return k.split(".")[1]; });
        var vols = {};
        slugs.forEach(function (s) { (vols[d["talk." + s + ".vol"]] = vols[d["talk." + s + ".vol"]] || []).push(s); });
        var mail = OZ.email();
        var html = "", toc = "", n = 0;
        Object.keys(vols).sort().forEach(function (v) {
          var title = d["talks.vol" + v + ".title"] || "";
          var parts = title.split(/\s+-\s+/);
          toc += '<li><a href="#vol' + v + '">Vol.' + v + " — " + esc(parts[1] || title) + "</a></li>";
          html += '<section class="t-vol" id="vol' + v + '"><header><span class="num">Vol.' + v + '</span>' +
            '<span class="h-kicker">' + esc(parts[0]) + "</span><h2>" + esc(parts[1] || title) + "</h2></header>";
          vols[v].forEach(function (s) {
            n++;
            var k = "talk." + s + ".";
            var ps = "", i = 1;
            while (d[k + "k" + i]) {
              var m = d[k + "k" + i].match(/^([^:]{2,60}):\s*(.*)$/);
              ps += "<li>" + (m ? "<b>" + esc(m[1]) + "</b> " + esc(m[2]) : esc(d[k + "k" + i])) + "</li>";
              i++;
            }
            ps = '<p class="sum">' + esc(d[k + "summary"] || "") + '</p><ul class="pts">' + ps + "</ul>";
            var subject = encodeURIComponent(d[k + "title"]);
            html += '<article class="t-talk" id="' + s + '"><span class="n">' + String(n).padStart(2, "0") + "</span><div>" +
              '<div class="meta"><span class="h-stamp">Vol.' + v + "</span>" + (featured.indexOf(s) >= 0 ? '<span class="h-stamp" style="transform:rotate(2deg)">★</span>' : "") + "</div>" +
              "<h3>" + esc(d[k + "title"]) + '</h3><p class="sub">' + esc(d[k + "subtitle"]) + "</p>" + ps +
              '<a class="invite" href="mailto:' + mail + "?subject=" + subject + '">' + esc(d["talks.invite"]) + " →</a></div>" +
              '<figure><img src="' + esc(d[k + "image"]) + '" alt="" loading="lazy" width="560" height="420"></figure></article>';
          });
          html += "</section>";
        });
        document.getElementById("vols").innerHTML = html;
        document.getElementById("toc").innerHTML = toc;
        if (location.hash && !render.done) {
          var el = document.getElementById(location.hash.slice(1));
          if (el) el.scrollIntoView();
        }
        render.done = true;
      });
    }
    OZ.ready.then(render);
    document.addEventListener("oz:langchange", render);
  })();
  </script>
</body>
</html>
