<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C. Murad Özsert</title>
<meta name="description" content="">
<meta name="oz-model" content="claude-opus-5">
<link rel="canonical" href="https://ozsert.com/">
<script src="/shared/core.js"></script>
<script src="/shared/topbar.js" defer></script>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap&subset=latin-ext">
<link rel="stylesheet" href="/models/claude-opus-5/style.css">
<script src="/models/claude-opus-5/script.js" defer></script>
</head>
<body>
<oz-topbar></oz-topbar>

<div class="vo5-grain" aria-hidden="true"></div>
<svg class="vo5-pen" id="vo5-pen" aria-hidden="true" focusable="false"><path id="vo5-pen-path"></path></svg>
<div class="vo5-peek" id="vo5-peek" aria-hidden="true"><span class="vo5-peek-tape"></span><img alt="" id="vo5-peek-img" width="320" height="320"></div>

<main class="vo5-main" id="vo5-main">

  <!-- ─────────────────────────────  COVER  ───────────────────────────── -->
  <section id="top" class="vo5-sec vo5-hero">
    <div class="vo5-wrap">

      <div class="vo5-kicker vo5-mono">
        <span data-i18n="hero.kicker"></span>
        <span class="vo5-coord">41.01° N, 28.98° E</span>
      </div>

      <div class="vo5-hero-grid">

        <div class="vo5-hero-head">
          <h1 class="vo5-h1" id="vo5-headline" data-i18n="hero.headline"></h1>
          <figure class="vo5-portrait">
            <span class="vo5-tape vo5-tape-a" aria-hidden="true"></span>
            <span class="vo5-tape vo5-tape-b" aria-hidden="true"></span>
            <span class="vo5-duo">
              <img src="/assets/portrait-upper.jpg" width="960" height="1200" data-i18n="[alt]hero.portrait_alt" alt="">
            </span>
          </figure>
        </div>

        <div class="vo5-hero-main">
          <p class="vo5-role" id="vo5-role" data-i18n="hero.role"></p>

          <p class="vo5-prev">
            <span class="vo5-mono vo5-tag" data-i18n="hero.previously_label"></span>
            <span data-i18n="hero.previously"></span>
          </p>

          <p class="vo5-manifesto" id="vo5-manifesto" data-i18n="hero.manifesto"></p>

          <div class="vo5-ctas">
            <a class="vo5-btn" href="#projects"><span class="vo5-btn-face" data-i18n="hero.cta_work"></span></a>
            <a class="vo5-link vo5-link-dn" href="#talks"><span data-i18n="hero.cta_talks"></span> <span aria-hidden="true">↓</span></a>
            <a class="vo5-link vo5-link-dn" href="#newsletter"><span data-i18n="hero.cta_newsletter"></span> <span aria-hidden="true">↓</span></a>
          </div>
        </div>

        <aside class="vo5-hero-side">
          <nav class="vo5-contents" id="vo5-contents" data-i18n="[aria-label]ui.contents">
            <p class="vo5-mono vo5-sidelabel" data-i18n="ui.contents"></p>
            <ul>
              <li><a href="#now"><i class="vo5-mono" aria-hidden="true">—</i><span data-i18n="now.label"></span></a></li>
              <li><a href="#projects"><i class="vo5-mono" aria-hidden="true">01</i><span data-i18n="projects.label"></span></a></li>
              <li><a href="#founder"><i class="vo5-mono" aria-hidden="true">02</i><span data-i18n="founder.label"></span></a></li>
              <li><a href="#talks"><i class="vo5-mono" aria-hidden="true">03</i><span data-i18n="talks.label"></span></a></li>
              <li><a href="#newsletter"><i class="vo5-mono" aria-hidden="true">04</i><span data-i18n="newsletter.label"></span></a></li>
              <li><a href="#experience"><i class="vo5-mono" aria-hidden="true">05</i><span data-i18n="experience.label"></span></a></li>
              <li><a href="#contact"><i class="vo5-mono" aria-hidden="true">→</i><span data-i18n="footer.label"></span></a></li>
            </ul>
          </nav>

          <p class="vo5-marginnote vo5-mono" id="vo5-marginnote" data-i18n="hero.margin_note"></p>

          <div class="vo5-ink" id="vo5-ink-hero"></div>
        </aside>

        <svg class="vo5-arrow" id="vo5-arrow" aria-hidden="true" focusable="false"></svg>
      </div>

      <figure class="vo5-fig vo5-fig1">
        <div class="vo5-fig-stage" id="vo5-scene"></div>
        <figcaption class="vo5-mono vo5-figcap">
          <span data-i18n="ui.fig"></span> 1 — <span id="vo5-fig1-cap"></span>
        </figcaption>
      </figure>
    </div>
  </section>

  <!-- ─────────────────────────────  NOW  ───────────────────────────── -->
  <section id="now" class="vo5-now" data-i18n="[aria-label]now.label">
    <div class="vo5-wrap">
      <div class="vo5-hrule" data-rule="0" aria-hidden="true"></div>
      <div class="vo5-now-line">
        <span class="vo5-mono vo5-now-label" data-i18n="now.label"></span>
        <span class="vo5-now-item"><span data-i18n="now.item1"></span><b class="vo5-caret" aria-hidden="true"></b></span>
        <span class="vo5-slash vo5-mono" aria-hidden="true">/</span>
        <span class="vo5-now-item" data-i18n="now.item2"></span>
        <span class="vo5-slash vo5-mono" aria-hidden="true">/</span>
        <span class="vo5-now-item" data-i18n="now.item3"></span>
        <span class="vo5-slash vo5-mono" aria-hidden="true">/</span>
        <a class="vo5-now-item vo5-now-link" href="#contact"><span data-i18n="now.item4"></span> <span aria-hidden="true">→</span></a>
      </div>
      <div class="vo5-hrule" data-rule="1" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ─────────────────────────────  01 WORKBENCH  ───────────────────────────── -->
  <section id="projects" class="vo5-sec" aria-labelledby="vo5-t-projects">
    <div class="vo5-wrap">
      <header class="vo5-shead">
        <p class="vo5-mono vo5-sno"><span aria-hidden="true">§ </span><span data-i18n="projects.section_no"></span> — <span data-i18n="projects.label"></span></p>
        <h2 class="vo5-stitle" id="vo5-t-projects" data-i18n="projects.title" data-ul="wave"></h2>
        <p class="vo5-sintro" data-i18n="projects.intro"></p>
        <p class="vo5-mono vo5-snote" data-i18n="projects.enterprise_note"></p>
      </header>
      <div class="vo5-rows vo5-indent" id="vo5-projects"></div>
    </div>
  </section>

  <!-- ─────────────────────────────  02 FOUNDER  ───────────────────────────── -->
  <section id="founder" class="vo5-sec" aria-labelledby="vo5-t-founder">
    <div class="vo5-wrap">
      <header class="vo5-shead">
        <p class="vo5-mono vo5-sno"><span aria-hidden="true">§ </span><span data-i18n="founder.section_no"></span> — <span data-i18n="founder.label"></span></p>
        <h2 class="vo5-stitle" id="vo5-t-founder" data-i18n="founder.title" data-ul="straight"></h2>
        <div class="vo5-founder-top">
          <div>
            <p class="vo5-sintro" data-i18n="founder.intro"></p>
            <p class="vo5-mono vo5-snote" data-i18n="founder.note"></p>
          </div>
          <div class="vo5-stampwrap">
            <span class="vo5-stamp vo5-stamp-big">Yolda.com · 2020–2025</span>
            <div class="vo5-minibar" id="vo5-minibar" aria-hidden="true"></div>
          </div>
        </div>
      </header>
      <div class="vo5-cases vo5-indent" id="vo5-cases"></div>
    </div>
  </section>

  <!-- ─────────────────────────────  03 TALKS  ───────────────────────────── -->
  <section id="talks" class="vo5-sec" aria-labelledby="vo5-t-talks">
    <div class="vo5-wrap">
      <header class="vo5-shead">
        <p class="vo5-mono vo5-sno"><span aria-hidden="true">§ </span><span data-i18n="talks.section_no"></span> — <span data-i18n="talks.label"></span></p>
        <h2 class="vo5-stitle" id="vo5-t-talks" data-i18n="talks.title" data-ul="dashed"></h2>
        <p class="vo5-sintro" data-i18n="talks.intro"></p>
      </header>
      <div class="vo5-rows vo5-indent" id="vo5-talks"></div>
      <div class="vo5-talks-foot vo5-indent">
        <a class="vo5-btn vo5-btn-sm" id="vo5-talks-cta" href="#contact"><span class="vo5-btn-face" data-i18n="talks.cta"></span></a>
        <a class="vo5-link" href="/models/claude-opus-5/talks/" data-i18n="talks.all"></a>
      </div>
    </div>
  </section>

  <!-- ─────────────────────────────  04 NEWSLETTER  ───────────────────────────── -->
  <section id="newsletter" class="vo5-sec" aria-labelledby="vo5-t-news">
    <div class="vo5-wrap">
      <header class="vo5-shead">
        <p class="vo5-mono vo5-sno"><span aria-hidden="true">§ </span><span data-i18n="newsletter.section_no"></span> — <span data-i18n="newsletter.label"></span></p>
        <h2 class="vo5-stitle" id="vo5-t-news" data-i18n="newsletter.name" data-ul="wave"></h2>
      </header>

      <div class="vo5-dispatch vo5-indent">
        <div class="vo5-dispatch-head">
          <p class="vo5-sintro" data-i18n="newsletter.tagline"></p>
          <p class="vo5-mono vo5-snote" data-i18n="newsletter.cadence"></p>
          <div class="vo5-ctas vo5-ctas-news">
            <a class="vo5-btn vo5-btn-sm" href="https://thenextsignalnewsletter.substack.com/" target="_blank" rel="noopener"><span class="vo5-btn-face" data-i18n="newsletter.subscribe_substack"></span></a>
            <a class="vo5-btn vo5-btn-sm vo5-btn-ghost" href="https://www.linkedin.com/build-relation/newsletter-follow?entityUrn=7346972552528834560" target="_blank" rel="noopener"><span class="vo5-btn-face" data-i18n="newsletter.subscribe_linkedin"></span></a>
          </div>
        </div>
        <figure class="vo5-fig vo5-fig2">
          <div class="vo5-fig-stage" id="vo5-fig2-stage"></div>
          <figcaption class="vo5-mono vo5-figcap">
            <span data-i18n="ui.fig"></span> 2 — <span data-i18n="newsletter.fig_caption"></span>
          </figcaption>
        </figure>
      </div>

      <p class="vo5-mono vo5-sidelabel vo5-latest vo5-indent" data-i18n="newsletter.latest"></p>
      <div class="vo5-rows vo5-indent" id="vo5-posts" aria-busy="true">
        <p class="vo5-mono vo5-state" data-i18n="newsletter.loading"></p>
      </div>
    </div>
  </section>

  <!-- ─────────────────────────────  05 EXPERIENCE  ───────────────────────────── -->
  <section id="experience" class="vo5-sec" aria-labelledby="vo5-t-exp">
    <div class="vo5-wrap">
      <header class="vo5-shead">
        <p class="vo5-mono vo5-sno"><span aria-hidden="true">§ </span><span data-i18n="experience.section_no"></span> — <span data-i18n="experience.label"></span></p>
        <h2 class="vo5-stitle" id="vo5-t-exp" data-i18n="experience.title" data-ul="straight"></h2>
      </header>

      <figure class="vo5-fig vo5-fig3 vo5-indent">
        <div class="vo5-fig-stage" id="vo5-fig3-stage"></div>
        <figcaption class="vo5-mono vo5-figcap" data-i18n="experience.fig"></figcaption>
      </figure>

      <ol class="vo5-cv vo5-indent" id="vo5-cv">
        <li class="vo5-cv-row vo5-cv-now"><span class="vo5-cv-org" data-i18n="experience.r1.org"></span><span class="vo5-cv-role" data-i18n="experience.r1.role"></span><span class="vo5-cv-yr vo5-mono" data-i18n="experience.r1.years" data-circle-last></span></li>
        <li class="vo5-cv-row"><span class="vo5-cv-org" data-i18n="experience.r2.org"></span><span class="vo5-cv-role" data-i18n="experience.r2.role"></span><span class="vo5-cv-yr vo5-mono" data-i18n="experience.r2.years"></span></li>
        <li class="vo5-cv-row vo5-cv-yolda"><a class="vo5-cv-jump" href="#founder"><span class="vo5-cv-org" data-i18n="experience.r3.org"></span><span class="vo5-cv-role" data-i18n="experience.r3.role"></span><span class="vo5-cv-yr vo5-mono" data-i18n="experience.r3.years"></span><span class="vo5-cv-arrow" aria-hidden="true">→</span></a></li>
        <li class="vo5-cv-row"><span class="vo5-cv-org" data-i18n="experience.r4.org"></span><span class="vo5-cv-role" data-i18n="experience.r4.role"></span><span class="vo5-cv-yr vo5-mono" data-i18n="experience.r4.years"></span></li>
        <li class="vo5-cv-row"><span class="vo5-cv-org" data-i18n="experience.r5.org"></span><span class="vo5-cv-role" data-i18n="experience.r5.role"></span><span class="vo5-cv-yr vo5-mono" data-i18n="experience.r5.years"></span></li>
        <li class="vo5-cv-row"><span class="vo5-cv-org" data-i18n="experience.r6.org"></span><span class="vo5-cv-role" data-i18n="experience.r6.role"></span><span class="vo5-cv-yr vo5-mono" data-i18n="experience.r6.years"></span></li>
        <li class="vo5-cv-row"><span class="vo5-cv-org" data-i18n="experience.r7.org"></span><span class="vo5-cv-role" data-i18n="experience.r7.role"></span><span class="vo5-cv-yr vo5-mono" data-i18n="experience.r7.years"></span></li>
        <li class="vo5-cv-row vo5-cv-edu"><span class="vo5-cv-org" data-i18n="experience.r8.org"></span><span class="vo5-cv-role" data-i18n="experience.r8.role"></span><span class="vo5-cv-yr vo5-mono" data-i18n="experience.r8.years"></span></li>
      </ol>
    </div>
  </section>

</main>

  <!-- ─────────────────────────────  CONTACT  ───────────────────────────── -->
  <footer id="contact" class="vo5-foot" aria-labelledby="vo5-t-foot">
    <div class="vo5-wrap">
      <p class="vo5-mono vo5-sno"><span aria-hidden="true">§ </span><span data-i18n="footer.label"></span></p>
      <h2 class="vo5-bigname" id="vo5-t-foot" data-i18n="footer.name"></h2>
      <p class="vo5-mono vo5-identity" data-i18n="footer.identity"></p>
      <p class="vo5-contact-intro" data-i18n="footer.contact_intro"></p>

      <div class="vo5-links">
        <div class="vo5-linkcell">
          <p class="vo5-mono vo5-sidelabel" data-i18n="footer.email_label"></p>
          <a class="vo5-handle" data-oz-email href="#"></a>
          <button type="button" class="vo5-copy vo5-mono" id="vo5-copy" data-i18n="ui.copy"></button>
        </div>
        <div class="vo5-linkcell">
          <p class="vo5-mono vo5-sidelabel" data-i18n="footer.linkedin_label"></p>
          <a class="vo5-handle" href="https://www.linkedin.com/in/ozsert" target="_blank" rel="noopener">in/ozsert <span aria-hidden="true">↗</span></a>
        </div>
        <div class="vo5-linkcell">
          <p class="vo5-mono vo5-sidelabel" data-i18n="footer.substack_label"></p>
          <a class="vo5-handle" href="https://thenextsignalnewsletter.substack.com/" target="_blank" rel="noopener">thenextsignal <span aria-hidden="true">↗</span></a>
        </div>
      </div>

      <div class="vo5-hrule" data-rule="9" aria-hidden="true"></div>

      <div class="vo5-footrow">
        <p class="vo5-mono vo5-signoff" data-i18n="footer.signoff"></p>
        <div class="vo5-ink vo5-ink-foot" id="vo5-ink-foot"></div>
        <a class="vo5-link vo5-mono vo5-totop" href="#top"><span data-i18n="ui.back_to_top"></span> <span aria-hidden="true">↑</span></a>
      </div>
      <p class="vo5-mono vo5-colophon" id="vo5-credit"></p>
    </div>
  </footer>

</body>
</html>
