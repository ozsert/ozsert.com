<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="oz-model" content="claude-opus-5-5">
<link rel="canonical" href="https://ozsert.com/">
<script src="/shared/core.js"></script>
<script src="/shared/topbar.js" defer></script>
<title>C. Murad Özsert</title>
<meta name="description" content="">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap&subset=latin-ext">
<link rel="stylesheet" href="/models/claude-opus-5-5/style.css">
<script src="/models/claude-opus-5-5/script.js" defer></script>
</head>
<body class="vo55-body">
<oz-topbar></oz-topbar>

<div class="vo55-grain" aria-hidden="true"></div>
<canvas class="vo55-trail" aria-hidden="true"></canvas>

<main class="vo55-main" id="main">
  <svg class="vo55-road" aria-hidden="true" focusable="false"><path class="vo55-road-base"/><path class="vo55-road-ink"/><g class="vo55-road-stops"></g></svg>

  <!-- ============ HERO ============ -->
  <section class="vo55-hero vo55-sec" id="top" aria-labelledby="vo55-h1">
    <div class="vo55-margin vo55-hero-margin" aria-hidden="true">
      <svg class="vo55-beacon" viewBox="0 0 80 80"><circle cx="40" cy="40" r="4"/><path d="M28 28a17 17 0 0 0 0 24M52 28a17 17 0 0 1 0 24M20 20a28 28 0 0 0 0 40M60 20a28 28 0 0 1 0 40"/></svg>
    </div>
    <div class="vo55-hero-body">
      <div class="vo55-kicker">
        <span class="vo55-kicker-l"></span>
        <span class="vo55-kicker-r"><span class="vo55-kicker-city"></span> · 41.01° N, 28.98° E</span>
      </div>

      <h1 class="vo55-h1" id="vo55-h1"></h1>

      <div class="vo55-hero-grid">
        <div class="vo55-hero-main">
          <p class="vo55-role"></p>
          <p class="vo55-prev"><span class="vo55-mono-label" data-i18n="hero.previously_label"></span> <span data-i18n="hero.previously"></span></p>
          <p class="vo55-manifesto"></p>

          <div class="vo55-ctas">
            <a class="vo55-btn" href="#projects"><span data-i18n="hero.cta_work"></span> <span aria-hidden="true">↓</span></a>
            <a class="vo55-textlink" href="#talks"><span data-i18n="hero.cta_talks"></span> <span aria-hidden="true">↓</span></a>
            <a class="vo55-textlink" href="#newsletter"><span data-i18n="hero.cta_newsletter"></span> <span aria-hidden="true">↓</span></a>
          </div>

          <div class="vo55-controls">
            <div class="vo55-ink" data-ink>
              <span class="vo55-mono-label" data-i18n="ui.ink"></span>
              <div class="vo55-ink-dots" role="group"></div>
              <span class="vo55-ink-name" aria-live="polite"></span>
            </div>
            <div class="vo55-toggles">
              <button type="button" class="vo55-toggle" data-toggle="trail" aria-pressed="true"><span data-i18n="ui.pen_trail"></span> <b class="vo55-toggle-state"></b></button>
              <span class="vo55-dotsep" aria-hidden="true">·</span>
              <button type="button" class="vo55-toggle" data-toggle="calm" aria-pressed="false"><span data-i18n="ui.calm_motion"></span> <b class="vo55-toggle-state"></b></button>
            </div>
          </div>
        </div>

        <aside class="vo55-hero-side">
          <figure class="vo55-portrait">
            <span class="vo55-tape vo55-tape-a" aria-hidden="true"></span>
            <span class="vo55-tape vo55-tape-b" aria-hidden="true"></span>
            <img src="/assets/portrait-upper.jpg" width="960" height="1200" alt="" data-i18n="[alt]hero.portrait_alt" fetchpriority="high">
          </figure>
          <p class="vo55-note" id="vo55-note"><span data-i18n="hero.margin_note"></span></p>
          <nav class="vo55-toc" aria-labelledby="vo55-toc-h">
            <h2 class="vo55-mono-label" id="vo55-toc-h" data-i18n="ui.contents"></h2>
            <ol>
              <li><a href="#projects"><span class="vo55-toc-n">01</span><span data-i18n="projects.label"></span></a></li>
              <li><a href="#founder"><span class="vo55-toc-n">02</span><span data-i18n="founder.label"></span></a></li>
              <li><a href="#talks"><span class="vo55-toc-n">03</span><span data-i18n="talks.label"></span></a></li>
              <li><a href="#newsletter"><span class="vo55-toc-n">04</span><span data-i18n="newsletter.label"></span></a></li>
              <li><a href="#experience"><span class="vo55-toc-n">05</span><span data-i18n="experience.label"></span></a></li>
              <li><a href="#contact"><span class="vo55-toc-n">@</span><span data-i18n="footer.label"></span></a></li>
            </ol>
          </nav>
        </aside>
        <svg class="vo55-arrow" aria-hidden="true" focusable="false"><path/><path class="vo55-arrow-head"/></svg>
      </div>

      <figure class="vo55-fig1">
        <div class="vo55-scenes" aria-hidden="true"></div>
        <figcaption class="vo55-figcap"><span class="vo55-fig1-n"></span> — <span class="vo55-fig1-cap"></span></figcaption>
      </figure>
    </div>
  </section>

  <!-- ============ NOW ============ -->
  <section class="vo55-now" id="now" aria-labelledby="vo55-now-h">
    <div class="vo55-margin"></div>
    <div class="vo55-now-body">
      <div class="vo55-rule" aria-hidden="true"></div>
      <p class="vo55-now-line">
        <span class="vo55-now-label" id="vo55-now-h" data-i18n="now.label"></span>
        <span class="vo55-now-item"><span data-i18n="now.item1"></span><span class="vo55-cursor" aria-hidden="true"></span></span>
        <span class="vo55-slash" aria-hidden="true">/</span>
        <span class="vo55-now-item" data-i18n="now.item2"></span>
        <span class="vo55-slash" aria-hidden="true">/</span>
        <span class="vo55-now-item" data-i18n="now.item3"></span>
        <span class="vo55-slash" aria-hidden="true">/</span>
        <a class="vo55-now-item vo55-now-link" href="#contact"><span data-i18n="now.item4"></span> <span aria-hidden="true">→</span></a>
      </p>
    </div>
  </section>

  <!-- ============ 01 WORKBENCH ============ -->
  <section class="vo55-sec" id="projects" aria-labelledby="vo55-projects-h">
    <div class="vo55-margin"><span class="vo55-secno" data-i18n="projects.section_no"></span></div>
    <div class="vo55-sec-body">
      <header class="vo55-sechead">
        <p class="vo55-eyebrow">§ <span data-i18n="projects.section_no"></span> — <span data-i18n="projects.label"></span></p>
        <h2 class="vo55-h2" id="vo55-projects-h" data-title="projects.title" data-ul="wave"></h2>
        <p class="vo55-intro" data-i18n="projects.intro"></p>
        <p class="vo55-mono-note" data-i18n="projects.enterprise_note"></p>
      </header>
      <ol class="vo55-rows vo55-projects" data-peek-list></ol>
    </div>
  </section>

  <!-- ============ 02 FOUNDER ============ -->
  <section class="vo55-sec" id="founder" aria-labelledby="vo55-founder-h">
    <div class="vo55-margin"><span class="vo55-secno" data-i18n="founder.section_no"></span></div>
    <div class="vo55-sec-body">
      <header class="vo55-sechead vo55-sechead-stamp">
        <p class="vo55-eyebrow">§ <span data-i18n="founder.section_no"></span> — <span data-i18n="founder.label"></span></p>
        <h2 class="vo55-h2" id="vo55-founder-h" data-title="founder.title" data-ul="straight"></h2>
        <div class="vo55-intro-row">
          <p class="vo55-intro" data-i18n="founder.intro"></p>
          <span class="vo55-stamp vo55-stamp-big">Yolda.com · 2020–2025</span>
        </div>
        <p class="vo55-mono-note" data-i18n="founder.note"></p>
      </header>
      <div class="vo55-cases"></div>
    </div>
  </section>

  <!-- ============ 03 TALKS ============ -->
  <section class="vo55-sec" id="talks" aria-labelledby="vo55-talks-h">
    <div class="vo55-margin"><span class="vo55-secno" data-i18n="talks.section_no"></span></div>
    <div class="vo55-sec-body">
      <header class="vo55-sechead">
        <p class="vo55-eyebrow">§ <span data-i18n="talks.section_no"></span> — <span data-i18n="talks.label"></span></p>
        <h2 class="vo55-h2" id="vo55-talks-h" data-title="talks.title" data-ul="dash"></h2>
        <p class="vo55-intro" data-i18n="talks.intro"></p>
      </header>
      <ol class="vo55-rows vo55-talks" data-peek-list></ol>
      <div class="vo55-after">
        <a class="vo55-btn" data-oz-email data-i18n="talks.cta" href="#contact"></a>
        <a class="vo55-textlink" href="/talks/" data-i18n="talks.all"></a>
      </div>
    </div>
  </section>

  <!-- ============ 04 NEWSLETTER ============ -->
  <section class="vo55-sec" id="newsletter" aria-labelledby="vo55-news-h">
    <div class="vo55-margin"><span class="vo55-secno" data-i18n="newsletter.section_no"></span></div>
    <div class="vo55-sec-body">
      <header class="vo55-sechead">
        <p class="vo55-eyebrow">§ <span data-i18n="newsletter.section_no"></span> — <span data-i18n="newsletter.label"></span></p>
      </header>
      <div class="vo55-news">
        <div class="vo55-dispatch">
          <span class="vo55-tape vo55-tape-c" aria-hidden="true"></span>
          <p class="vo55-mono-label" data-i18n="newsletter.cadence"></p>
          <h2 class="vo55-news-name" id="vo55-news-h" data-title="newsletter.name" data-ul="scribble"></h2>
          <p class="vo55-news-tag" data-i18n="newsletter.tagline"></p>
          <figure class="vo55-fig2">
            <svg class="vo55-wave" viewBox="0 0 520 120" aria-hidden="true" focusable="false"></svg>
            <figcaption class="vo55-figcap"><span class="vo55-fig2-n"></span> — <span data-i18n="newsletter.fig_caption"></span></figcaption>
          </figure>
          <div class="vo55-subs">
            <a class="vo55-btn" href="https://thenextsignalnewsletter.substack.com/" rel="noopener" target="_blank"><span data-i18n="newsletter.subscribe_substack"></span> <span aria-hidden="true">↗</span></a>
            <a class="vo55-btn vo55-btn-alt" href="https://www.linkedin.com/build-relation/newsletter-follow?entityUrn=7346972552528834560" rel="noopener" target="_blank"><span data-i18n="newsletter.subscribe_linkedin"></span> <span aria-hidden="true">↗</span></a>
          </div>
        </div>
        <div class="vo55-issues">
          <h3 class="vo55-mono-label" data-i18n="newsletter.latest"></h3>
          <div class="vo55-issues-state" aria-live="polite"></div>
          <ol class="vo55-rows vo55-posts" data-peek-list></ol>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 05 EXPERIENCE ============ -->
  <section class="vo55-sec" id="experience" aria-labelledby="vo55-exp-h">
    <div class="vo55-margin"><span class="vo55-secno" data-i18n="experience.section_no"></span></div>
    <div class="vo55-sec-body">
      <header class="vo55-sechead">
        <p class="vo55-eyebrow">§ <span data-i18n="experience.section_no"></span> — <span data-i18n="experience.label"></span></p>
        <h2 class="vo55-h2" id="vo55-exp-h" data-title="experience.title" data-ul="double"></h2>
      </header>
      <figure class="vo55-fig3">
        <div class="vo55-scale"></div>
        <figcaption class="vo55-figcap" data-i18n="experience.fig"></figcaption>
      </figure>
      <ol class="vo55-exp"></ol>
    </div>
  </section>

  <div class="vo55-peek" aria-hidden="true"><span class="vo55-tape vo55-tape-p"></span><div class="vo55-peek-in"></div></div>
</main>

<!-- ============ CONTACT ============ -->
<footer class="vo55-foot" id="contact" aria-labelledby="vo55-name">
  <div class="vo55-foot-in">
    <p class="vo55-eyebrow">§ @ — <span data-i18n="footer.label"></span></p>
    <h2 class="vo55-bigname" id="vo55-name" data-i18n="footer.name"></h2>
    <p class="vo55-identity" data-i18n="footer.identity"></p>
    <p class="vo55-hello" data-i18n="footer.contact_intro"></p>

    <ul class="vo55-links">
      <li>
        <span class="vo55-mono-label"><span data-i18n="footer.email_label"></span> ↗</span>
        <a class="vo55-handle" data-oz-email href="#contact"></a>
        <button type="button" class="vo55-copy" data-i18n="ui.copy"></button>
      </li>
      <li>
        <span class="vo55-mono-label"><span data-i18n="footer.linkedin_label"></span> ↗</span>
        <a class="vo55-handle" href="https://www.linkedin.com/in/ozsert" rel="noopener" target="_blank">in/ozsert</a>
      </li>
      <li>
        <span class="vo55-mono-label"><span data-i18n="footer.substack_label"></span> ↗</span>
        <a class="vo55-handle" href="https://thenextsignalnewsletter.substack.com/" rel="noopener" target="_blank">thenextsignal</a>
      </li>
    </ul>

    <div class="vo55-foot-bottom">
      <p class="vo55-signoff" data-i18n="footer.signoff"></p>
      <div class="vo55-ink vo55-ink-small" data-ink>
        <span class="vo55-mono-label" data-i18n="ui.ink"></span>
        <div class="vo55-ink-dots" role="group"></div>
        <span class="vo55-ink-name"></span>
      </div>
      <a class="vo55-textlink vo55-top" href="#top"><span data-i18n="ui.back_to_top"></span> <span aria-hidden="true">↑</span></a>
    </div>
    <p class="vo55-colophon"><span aria-hidden="true">📡</span> <span class="vo55-credit"></span></p>
  </div>
</footer>
</body>
</html>
