<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="oz-page" content="talks">
  <link rel="canonical" href="https://ozsert.com/talks/">
  <script src="/shared/core.js"></script>
  <script src="/shared/topbar.js" defer></script>
  <title data-oz-keep-title>Talks — C. Murad Özsert</title>
  <meta name="description" content="">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&display=swap&subset=latin-ext">
  <link rel="stylesheet" href="/models/claude-opus-5-5/talks/style.css">
  <script src="/models/claude-opus-5-5/talks/script.js" defer></script>
</head>
<body>
<oz-topbar></oz-topbar>

<main class="vo55-main" id="top">

  <!-- ============ HERO ============ -->
  <header class="vo55-hero vo55-row" aria-labelledby="vo55-h1">
    <div class="vo55-margin" aria-hidden="true">
      <span class="vo55-secno" data-i18n="talks.section_no"></span>
    </div>

    <div class="vo55-col">
      <a class="vo55-back" href="/models/claude-opus-5-5/#talks" data-i18n="talks.back_home"></a>
      <p class="vo55-kicker">§ <span data-i18n="talks.section_no"></span> — <span data-i18n="hero.cta_talks"></span></p>
      <h1 class="vo55-h1" id="vo55-h1"></h1>
      <p class="vo55-lead" data-i18n="talks.page_intro"></p>
      <p class="vo55-intro" data-i18n="talks.intro"></p>
    </div>

    <aside class="vo55-aside">
      <a class="vo55-note vo55-mail" data-mail href="#">
        <svg class="vo55-note-arrow" viewBox="0 0 120 70" aria-hidden="true"><path d="M112 8 C 80 6, 40 14, 22 44 M 22 44 l 2 -14 M 22 44 l 13 -5"/></svg>
        <span data-i18n="talks.cta"></span> ↗
      </a>
    </aside>

    <!-- fig. 1: three index-card boxes -->
    <figure class="vo55-herofig vo55-col-wide">
      <div class="vo55-boxes" id="vo55-boxes"></div>
      <figcaption class="vo55-cap" id="vo55-cap-1"></figcaption>
    </figure>
  </header>

  <!-- ============ FACTS ============ -->
  <section class="vo55-facts vo55-row">
    <div class="vo55-margin" aria-hidden="true"></div>
    <ul class="vo55-factlist vo55-col-wide">
      <li class="vo55-fact"><span class="vo55-fact-n">3</span><span class="vo55-fact-l" data-i18n="ui.vol"></span></li>
      <li class="vo55-fact"><span class="vo55-fact-n">12</span><span class="vo55-fact-l" data-i18n="hero.cta_talks"></span></li>
      <li class="vo55-fact vo55-fact-lang">
        <span class="vo55-fact-n"><button type="button" data-lang="tr">TR</button><span aria-hidden="true"> / </span><button type="button" data-lang="en">EN</button></span>
        <svg class="vo55-fact-sw" viewBox="0 0 80 14" aria-hidden="true"><path d="M4 7 H76 M10 2 L4 7 L10 12 M70 2 L76 7 L70 12"/></svg>
      </li>
      <li class="vo55-fact vo55-fact-venue">
        <span class="vo55-fact-n vo55-venue" aria-hidden="true">
          <svg viewBox="0 0 132 56">
            <!-- stage: podium + lectern -->
            <path d="M4 50 H58 M8 50 V40 H54 V50"/>
            <path d="M24 40 V24 H38 V40 M22 24 H40"/>
            <circle cx="31" cy="14" r="5"/>
            <path d="M14 8 q 6 -6 12 -2 M50 8 q -6 -6 -12 -2" class="vo55-arc"/>
            <!-- swap -->
            <path d="M62 26 H72 M68 22 L72 26 L68 30" class="vo55-arc"/>
            <!-- in-house: table with people -->
            <path d="M80 40 H128 M86 40 V50 M122 40 V50"/>
            <circle cx="92" cy="30" r="4"/><circle cx="104" cy="28" r="4"/><circle cx="116" cy="30" r="4"/>
            <path d="M86 40 q 6 -8 12 0 M98 40 q 6 -8 12 0 M110 40 q 6 -8 12 0"/>
          </svg>
        </span>
        <span class="vo55-fact-l" id="vo55-venue-l"></span>
      </li>
    </ul>
  </section>

  <!-- ============ VOLUMES (chapters) ============ -->
  <div id="vo55-volumes"></div>

  <!-- ============ CLOSING ============ -->
  <section class="vo55-close vo55-row" aria-labelledby="vo55-cta-h">
    <div class="vo55-margin" aria-hidden="true"><span class="vo55-secno">→</span></div>
    <div class="vo55-col-wide vo55-close-in">
      <p class="vo55-kicker" data-i18n="footer.contact_intro"></p>
      <h2 class="vo55-cta-h" id="vo55-cta-h">
        <a class="vo55-cta" data-mail href="#"><span data-i18n="talks.cta"></span> <span class="vo55-cta-arrow" aria-hidden="true">↗</span></a>
      </h2>
      <p class="vo55-mailline"><a data-oz-email href="#"></a></p>
      <svg class="vo55-rule" viewBox="0 0 600 10" preserveAspectRatio="none" aria-hidden="true"><path d="M0 5 C 100 2, 200 8, 300 5 S 500 3, 600 6"/></svg>
      <footer class="vo55-foot">
        <a class="vo55-back" href="/models/claude-opus-5-5/#talks" data-i18n="talks.back_home"></a>
        <p class="vo55-credit" id="vo55-credit"></p>
      </footer>
    </div>
  </section>
</main>
</body>
</html>
